plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.sonicshare.desktop.Main'
}

jar {
    archiveBaseName = 'sonic-share-desktop'
    manifest {
        attributes(
            'Main-Class': 'com.sonicshare.desktop.Main',
            'Implementation-Title': 'Sonic Share Desktop',
            'Implementation-Version': '1.0'
        )
    }
}

test {
    useJUnitPlatform()
}
